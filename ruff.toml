# Ruff configuration. Pragmatic settings — strict enough to catch real
# problems, loose enough not to gate routine M2/M3 PRs on stylistic noise.

line-length = 100
target-version = "py310"

exclude = [
    "venv",
    ".venv",
    "legacy",
    "zerotrust/tests",       # tests get more wiggle room
]

[lint]
# Curated rule set: pycodestyle errors, pyflakes, isort, bugbear,
# comprehensions, pep8-naming. No formatting-only nitpicks.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # bugbear (likely bugs)
    "C4",   # comprehensions
    "N",    # pep8 naming
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long — Ruff format handles long strings sensibly
    "B008",  # function call in default arg — fine for our use
]

[lint.per-file-ignores]
"scripts/*" = ["N999"]  # script filenames may not be valid module names
